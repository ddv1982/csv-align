name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_ARTIFACT_NAME: csv-align-linux-x86_64-release-bundle
  FRONTEND_DIST_ARTIFACT_NAME: csv-align-frontend-dist
  LINUX_STAGE_ARTIFACT_NAME: csv-align-release-linux-${{ github.run_id }}-${{ github.run_attempt }}
  APT_STAGE_ARTIFACT_NAME: csv-align-apt-pages-${{ github.run_id }}-${{ github.run_attempt }}
  MACOS_STAGE_ARTIFACT_PREFIX: csv-align-release-macos-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-22.04
    outputs:
      ci_run_id: ${{ steps.wait_for_ci.outputs.ci_run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go for Actionlint
        # actions/setup-go v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          check-latest: false
          cache: false

      - name: Validate release workflow with pinned Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/release.yml

      - name: Validate release metadata
        run: python3 scripts/check_release_metadata.py --expected-tag "${{ github.ref_name }}"

      - name: Wait for CI on tagged commit
        id: wait_for_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAGGED_SHA: ${{ github.sha }}
          RELEASE_ARTIFACT_NAME: ${{ env.RELEASE_ARTIFACT_NAME }}
          FRONTEND_DIST_ARTIFACT_NAME: ${{ env.FRONTEND_DIST_ARTIFACT_NAME }}
        run: |
          deadline=$((SECONDS + 3600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            run_json="$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${TAGGED_SHA}&event=push&per_page=20")"
            run_state="$(printf '%s' "$run_json" | python3 -c "import json, sys; runs = json.load(sys.stdin).get('workflow_runs', []); match = next((run for run in runs if run.get('name') == 'CI' and run.get('head_branch') == 'main'), None); print('' if match is None else f\"{match.get('id', '')}\\t{match.get('status', '')}\\t{match.get('conclusion') or ''}\\t{match.get('html_url', '')}\")")"

            run_id="${run_state%%$'\t'*}"
            remainder="${run_state#*$'\t'}"
            status="${remainder%%$'\t'*}"
            remainder="${remainder#*$'\t'}"
            conclusion="${remainder%%$'\t'*}"
            run_url="${remainder#*$'\t'}"

            if [ -z "$run_state" ]; then
              echo "Waiting for CI run for commit ${TAGGED_SHA} to appear..."
              sleep 20
              continue
            fi

            echo "Observed CI run status: ${status:-unknown} ${conclusion:-}"

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              for artifact_name in "$RELEASE_ARTIFACT_NAME" "$FRONTEND_DIST_ARTIFACT_NAME"; do
                artifact_count="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?name=${artifact_name}" --jq '[.artifacts[] | select(.expired == false)] | length')"
                if [ "$artifact_count" -eq 0 ]; then
                  echo "CI succeeded for ${TAGGED_SHA} but did not publish a non-expired artifact named ${artifact_name}." >&2
                  exit 1
                fi
              done

              echo "ci_run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "CI succeeded for ${TAGGED_SHA}: ${run_url}"
              exit 0
            fi

            if [ "$status" = "completed" ]; then
              echo "CI did not succeed for ${TAGGED_SHA}: ${run_url}" >&2
              exit 1
            fi

            sleep 20
          done

          echo "Timed out waiting for CI to finish for ${TAGGED_SHA}." >&2
          exit 1

  stage-linux-release:
    name: Stage Linux and APT Assets
    needs: validate-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download reusable Tauri bundle artifact from CI
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.ci_run_id }}
          path: release-artifacts

      - name: Inspect downloaded release artifacts
        run: ls -R release-artifacts

      - name: Install Linux signature and metadata validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-sig gnupg appstream desktop-file-utils rpm rpm2cpio

      - name: Verify Debian package signatures
        env:
          DEB_SIGNING_PUBLIC_KEY: ${{ vars.DEB_SIGNING_PUBLIC_KEY }}
          DEB_SIGNING_KEY_FINGERPRINT: ${{ secrets.DEB_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${DEB_SIGNING_PUBLIC_KEY}" ] || missing+=("DEB_SIGNING_PUBLIC_KEY repository variable")
          [ -n "${DEB_SIGNING_KEY_FINGERPRINT}" ] || missing+=("DEB_SIGNING_KEY_FINGERPRINT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required Debian signature verification inputs are missing: ${missing[*]}" >&2
            exit 1
          fi

          shopt -s globstar nullglob
          deb_packages=(release-artifacts/**/*.deb)

          if [ ${#deb_packages[@]} -eq 0 ]; then
            echo "No Debian packages found under release-artifacts." >&2
            exit 1
          fi

          gnupg_home="$(mktemp -d)"
          verification_home="$(mktemp -d)"
          public_key_file="$(mktemp)"
          expected_public_key_file=""
          safe_deb_file=""
          cleanup() {
            rm -rf "${gnupg_home}"
            rm -rf "${verification_home}"
            rm -f "${public_key_file}"
            if [ -n "${expected_public_key_file}" ]; then
              rm -f "${expected_public_key_file}"
            fi
            if [ -n "${safe_deb_file}" ]; then
              rm -f "${safe_deb_file}"
            fi
          }
          trap cleanup EXIT

          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"

          printf '%s' "${DEB_SIGNING_PUBLIC_KEY}" | base64 --decode > "${public_key_file}"
          gpg --batch --import "${public_key_file}"

          expected_fingerprint="$(printf '%s' "${DEB_SIGNING_KEY_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "${expected_fingerprint}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"

          if [ "${imported_fingerprint}" != "${expected_fingerprint}" ]; then
            echo "Imported Debian signing public key fingerprint did not match DEB_SIGNING_KEY_FINGERPRINT." >&2
            exit 1
          fi

          expected_public_key_file="$(mktemp)"
          gpg --batch --armor --export "${expected_fingerprint}" > "${expected_public_key_file}"
          chmod 700 "${verification_home}"
          GNUPGHOME="${verification_home}" gpg --batch --import "${expected_public_key_file}"

          for deb in "${deb_packages[@]}"; do
            echo "Verifying ${deb}"
            deb_basename="$(basename "${deb}")"
            safe_basename="$(printf '%s' "${deb_basename}" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
            safe_deb_file="${RUNNER_TEMP:-/tmp}/${safe_basename}"
            if [ -e "${safe_deb_file}" ]; then
              safe_deb_file="${RUNNER_TEMP:-/tmp}/verify-${RANDOM}-${safe_basename}"
            fi
            cp "${deb}" "${safe_deb_file}"
            GNUPGHOME="${verification_home}" dpkg-sig --verify-role builder "${safe_deb_file}"
            rm -f "${safe_deb_file}"
            safe_deb_file=""
          done

      - name: Validate Debian package metadata
        env:
          DEB_METADATA_REPORT: deb-metadata-report.json
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          deb_packages=(release-artifacts/**/*.deb)
          if [ ${#deb_packages[@]} -eq 0 ]; then
            echo "No Debian packages found under release-artifacts." >&2
            exit 1
          fi

          set +e
          python3 scripts/validate_linux_deb_metadata.py \
            "${deb_packages[@]}" \
            --json-report "${DEB_METADATA_REPORT}"
          validator_status=$?
          set -e

          python3 <<'PY'
          import json
          import os
          import pathlib

          report_path = pathlib.Path(os.environ["DEB_METADATA_REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = [
              "## Debian package metadata validation",
              "",
              f"Gate: {'PASS' if report['ok'] else 'FAIL'}",
              "",
              "| Package | Component ID | Project license | Desktop ID | Binary |",
              "| --- | --- | --- | --- | --- |",
          ]
          for package in report["packages"]:
              lines.append(
                  "| {package} | {component_id} | {project_license} | {launchable} | {binary} |".format(
                      package=pathlib.Path(package["package"]).name,
                      component_id=package.get("component_id") or "",
                      project_license=package.get("project_license") or "",
                      launchable=package.get("launchable") or "",
                      binary=package.get("binary") or "",
                  )
              )
          lines.extend(["", f"JSON report: `{report_path}`"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

          exit "${validator_status}"

      - name: Validate RPM package metadata
        env:
          RPM_METADATA_REPORT: rpm-metadata-report.json
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          rpm_packages=(release-artifacts/**/*.rpm)
          if [ ${#rpm_packages[@]} -eq 0 ]; then
            echo "No RPM packages found under release-artifacts." >&2
            exit 1
          fi

          set +e
          python3 scripts/validate_linux_deb_metadata.py \
            "${rpm_packages[@]}" \
            --json-report "${RPM_METADATA_REPORT}"
          validator_status=$?
          set -e

          python3 <<'PY'
          import json
          import os
          import pathlib

          report_path = pathlib.Path(os.environ["RPM_METADATA_REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = [
              "## RPM package metadata validation",
              "",
              f"Gate: {'PASS' if report['ok'] else 'FAIL'}",
              "",
              "| Package | Component ID | Project license | Desktop ID | Binary |",
              "| --- | --- | --- | --- | --- |",
          ]
          for package in report["packages"]:
              lines.append(
                  "| {package} | {component_id} | {project_license} | {launchable} | {binary} |".format(
                      package=pathlib.Path(package["package"]).name,
                      component_id=package.get("component_id") or "",
                      project_license=package.get("project_license") or "",
                      launchable=package.get("launchable") or "",
                      binary=package.get("binary") or "",
                  )
              )
          lines.extend(["", f"JSON report: `{report_path}`"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

          exit "${validator_status}"

      - name: Build signed APT repository
        env:
          APT_REPO_SIGNING_PRIVATE_KEY: ${{ secrets.APT_REPO_SIGNING_PRIVATE_KEY }}
          APT_REPO_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_REPO_SIGNING_KEY_FINGERPRINT }}
          APT_REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_REPO_SIGNING_KEY_PASSPHRASE }}
          DEB_SIGNING_PRIVATE_KEY: ${{ secrets.DEB_SIGNING_PRIVATE_KEY }}
          DEB_SIGNING_KEY_FINGERPRINT: ${{ secrets.DEB_SIGNING_KEY_FINGERPRINT }}
          DEB_SIGNING_KEY_PASSPHRASE: ${{ secrets.DEB_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          signing_private_key="${APT_REPO_SIGNING_PRIVATE_KEY}"
          signing_fingerprint="${APT_REPO_SIGNING_KEY_FINGERPRINT}"
          signing_passphrase="${APT_REPO_SIGNING_KEY_PASSPHRASE}"
          signing_source="APT repository signing key"

          if [ -z "${signing_private_key}" ] && [ -z "${signing_fingerprint}" ]; then
            signing_private_key="${DEB_SIGNING_PRIVATE_KEY}"
            signing_fingerprint="${DEB_SIGNING_KEY_FINGERPRINT}"
            signing_passphrase="${DEB_SIGNING_KEY_PASSPHRASE}"
            signing_source="Debian package signing key fallback"
          fi

          missing=()
          [ -n "${signing_private_key}" ] || missing+=("APT_REPO_SIGNING_PRIVATE_KEY or DEB_SIGNING_PRIVATE_KEY")
          [ -n "${signing_fingerprint}" ] || missing+=("APT_REPO_SIGNING_KEY_FINGERPRINT or DEB_SIGNING_KEY_FINGERPRINT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required APT repository signing inputs are missing: ${missing[*]}" >&2
            exit 1
          fi
          echo "Using ${signing_source} for APT repository Release signing."

          deb_packages=(release-artifacts/**/*.deb)
          if [ ${#deb_packages[@]} -eq 0 ]; then
            echo "No Debian packages found under release-artifacts." >&2
            exit 1
          fi

          gnupg_home="$(mktemp -d)"
          verification_home="$(mktemp -d)"
          key_file="$(mktemp)"
          passphrase_file=""
          setup_extract_dir=""
          cleanup() {
            rm -rf "${gnupg_home}"
            rm -rf "${verification_home}"
            rm -f "${key_file}"
            if [ -n "${passphrase_file}" ]; then
              rm -f "${passphrase_file}"
            fi
            if [ -n "${setup_extract_dir}" ]; then
              rm -rf "${setup_extract_dir}"
            fi
          }
          trap cleanup EXIT

          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"
          echo allow-loopback-pinentry > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          printf '%s' "${signing_private_key}" | base64 --decode > "${key_file}"
          gpg --batch --import "${key_file}"

          expected_fingerprint="$(printf '%s' "${signing_fingerprint}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "${expected_fingerprint}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"

          if [ "${imported_fingerprint}" != "${expected_fingerprint}" ]; then
            echo "Imported APT repository signing key fingerprint did not match the selected signing fingerprint." >&2
            exit 1
          fi

          passphrase_args=()
          gpg_passphrase_options=()
          if [ -n "${signing_passphrase}" ]; then
            passphrase_file="$(mktemp)"
            chmod 600 "${passphrase_file}"
            printf '%s' "${signing_passphrase}" > "${passphrase_file}"
            passphrase_args=(--gpg-passphrase-file "${passphrase_file}")
            gpg_passphrase_options=(--passphrase-file "${passphrase_file}")
          else
            echo "Selected APT repository signing passphrase is not set; signing will only work for an intentionally unprotected key."
          fi

          setup_package="csv-align-repository-setup_1.0_all.deb"
          mkdir -p staged-linux-assets
          python3 scripts/build_apt_repository.py \
            --clean \
            --output apt-repository \
            --suite stable \
            --repository-url "https://ddv1982.github.io/csv-align/apt/" \
            --gpg-homedir "${gnupg_home}" \
            --gpg-key "${expected_fingerprint}" \
            --public-key-out apt-repository/csv-align-archive-keyring.pgp \
            --setup-package-out "${setup_package}" \
            "${passphrase_args[@]}" \
            "${deb_packages[@]}"

          EXPECTED_FINGERPRINT="${expected_fingerprint}" python3 <<'PY'
          import os
          import pathlib

          fingerprint = os.environ["EXPECTED_FINGERPRINT"]
          source_path = pathlib.Path("scripts/install-apt-repo.sh")
          destination_path = pathlib.Path("staged-linux-assets/install-apt-repo.sh")
          script = source_path.read_text(encoding="utf-8")
          placeholder = "__CSV_ALIGN_APT_SIGNING_KEY_FINGERPRINT__"
          if placeholder not in script:
              raise SystemExit(f"missing installer fingerprint placeholder {placeholder}")
          destination_path.write_text(script.replace(placeholder, fingerprint), encoding="utf-8")
          PY

          sha256sum "${setup_package}" > "${setup_package}.sha256"
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --homedir "${gnupg_home}" \
            --local-user "${expected_fingerprint}" \
            "${gpg_passphrase_options[@]}" \
            --armor \
            --detach-sign \
            --output "${setup_package}.sha256.asc" \
            "${setup_package}.sha256"

          test "$(dpkg-deb --field "${setup_package}" Package)" = "csv-align-repository-setup"
          test "$(dpkg-deb --field "${setup_package}" Version)" = "1.0"
          test "$(dpkg-deb --field "${setup_package}" Architecture)" = "all"
          setup_extract_dir="$(mktemp -d)"
          dpkg-deb -x "${setup_package}" "${setup_extract_dir}"
          test -s "${setup_extract_dir}/usr/share/keyrings/csv-align-archive-keyring.pgp"
          grep -Fx "Types: deb" "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          grep -Fx "URIs: https://ddv1982.github.io/csv-align/apt/" "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          grep -Fx "Suites: stable" "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          grep -Fx "Components: main" "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          grep -E '^Architectures: .*amd64( |$)' "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          grep -Fx "Signed-By: /usr/share/keyrings/csv-align-archive-keyring.pgp" "${setup_extract_dir}/etc/apt/sources.list.d/csv-align.sources"
          sh -n staged-linux-assets/install-apt-repo.sh
          if grep -F "__CSV_ALIGN_APT_SIGNING_KEY_FINGERPRINT__" staged-linux-assets/install-apt-repo.sh; then
            echo "Staged installer still contains the signing fingerprint placeholder." >&2
            exit 1
          fi

          chmod 700 "${verification_home}"
          GNUPGHOME="${verification_home}" gpg --batch --import apt-repository/csv-align-archive-keyring.pgp
          GNUPGHOME="${verification_home}" gpg --batch --verify apt-repository/dists/stable/InRelease
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            apt-repository/dists/stable/Release.gpg \
            apt-repository/dists/stable/Release
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            "${setup_package}.sha256.asc" \
            "${setup_package}.sha256"

          mkdir -p pages-site/apt
          cp -a apt-repository/. pages-site/apt/

      - name: Assemble and verify exact Linux release assets
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          deb_assets=(release-artifacts/**/*.deb)
          rpm_assets=(release-artifacts/**/*.rpm)
          appimage_assets=(release-artifacts/**/*.AppImage)
          if [ ${#deb_assets[@]} -ne 1 ] || [ ${#rpm_assets[@]} -ne 1 ] || [ ${#appimage_assets[@]} -ne 1 ]; then
            echo "Expected exactly one app .deb, .rpm, and .AppImage before staging." >&2
            exit 1
          fi

          cp "${deb_assets[0]}" staged-linux-assets/
          cp "${rpm_assets[0]}" staged-linux-assets/
          cp "${appimage_assets[0]}" staged-linux-assets/
          cp csv-align-repository-setup_1.0_all.deb staged-linux-assets/
          cp csv-align-repository-setup_1.0_all.deb.sha256 staged-linux-assets/
          cp csv-align-repository-setup_1.0_all.deb.sha256.asc staged-linux-assets/

          python3 scripts/verify_release_assets.py staged-linux-assets \
            --tag "${{ github.ref_name }}" \
            --platform linux \
            --verify-package-metadata

      - name: Upload uniquely named Linux release stage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUX_STAGE_ARTIFACT_NAME }}
          path: staged-linux-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Upload uniquely named APT Pages stage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APT_STAGE_ARTIFACT_NAME }}
          path: pages-site/
          if-no-files-found: error
          retention-days: 7

  stage-macos-release:
    name: Stage macOS Asset (${{ matrix.target }})
    needs: validate-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_arch: aarch64
            verifier_platform: macos-aarch64
          - target: x86_64-apple-darwin
            asset_arch: x64
            verifier_platform: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download frontend dist artifact from CI
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.FRONTEND_DIST_ARTIFACT_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.ci_run_id }}
          path: frontend/dist

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          key: tauri-release-${{ runner.os }}-${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "2.11.3"

      - name: Prepare Apple signing environment
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -n "$APPLE_CERTIFICATE_SECRET" ] || missing+=("APPLE_CERTIFICATE")
          [ -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -n "$KEYCHAIN_PASSWORD_SECRET" ] || missing+=("KEYCHAIN_PASSWORD")
          [ -n "$APPLE_API_ISSUER_SECRET" ] || missing+=("APPLE_API_ISSUER")
          [ -n "$APPLE_API_KEY_SECRET" ] || missing+=("APPLE_API_KEY")
          [ -n "$APPLE_API_PRIVATE_KEY_SECRET" ] || missing+=("APPLE_API_PRIVATE_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required macOS release secrets are missing: ${missing[*]}" >&2
            echo "Configure App Store Connect API key authentication; Apple ID/app-specific-password notarization is not supported by this workflow." >&2
            exit 1
          fi

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64
          import os
          import pathlib

          pathlib.Path("certificate.p12").write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"])
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain
          CERT_ID=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "No Developer ID Application signing identity was imported." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          rm -f certificate.p12

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 <<'PY'
          import base64
          import os
          import pathlib

          key_path = pathlib.Path(f"AuthKey_{os.environ['APPLE_API_KEY']}.p8")
          key_path.write_bytes(base64.b64decode(os.environ["APPLE_API_PRIVATE_KEY"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APPLE_API_KEY_PATH={key_path.resolve()}\n")
          PY

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          CSV_ALIGN_USE_PREBUILT_FRONTEND: '1'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          rm -rf target/${{ matrix.target }}/release/bundle
          cargo tauri build --verbose --target ${{ matrix.target }}

      - name: Assemble and verify exact macOS release asset
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#assets[@]} -ne 1 ]; then
            echo "Expected exactly one macOS DMG asset for ${{ matrix.target }}." >&2
            exit 1
          fi
          hdiutil verify "${assets[0]}"

          version="${GITHUB_REF_NAME#v}"
          expected_name="CSV.Align_${version}_${{ matrix.asset_arch }}.dmg"
          if [ "$(basename "${assets[0]}")" != "${expected_name}" ]; then
            echo "macOS asset basename/version mismatch: expected ${expected_name}, found $(basename "${assets[0]}")." >&2
            exit 1
          fi

          mkdir -p staged-macos-assets
          cp "${assets[0]}" staged-macos-assets/
          python3 scripts/verify_release_assets.py staged-macos-assets \
            --tag "${{ github.ref_name }}" \
            --platform "${{ matrix.verifier_platform }}"

      - name: Upload uniquely named macOS release stage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MACOS_STAGE_ARTIFACT_PREFIX }}-${{ matrix.target }}
          path: staged-macos-assets/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Verified Release
    needs: [validate-release, stage-linux-release, stage-macos-release]
    runs-on: ubuntu-22.04
    concurrency:
      group: csv-align-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install release asset inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm

      - name: Download Linux release stage
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.LINUX_STAGE_ARTIFACT_NAME }}
          path: publication-inputs/linux

      - name: Download macOS ARM64 release stage
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.MACOS_STAGE_ARTIFACT_PREFIX }}-aarch64-apple-darwin
          path: publication-inputs/macos-aarch64

      - name: Download macOS Intel release stage
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.MACOS_STAGE_ARTIFACT_PREFIX }}-x86_64-apple-darwin
          path: publication-inputs/macos-x86_64

      - name: Download staged APT Pages site
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.APT_STAGE_ARTIFACT_NAME }}
          path: staged-pages

      - name: Assemble and verify complete managed release set
        run: |
          set -euo pipefail
          mkdir -p managed-assets
          cp publication-inputs/linux/* managed-assets/
          cp publication-inputs/macos-aarch64/* managed-assets/
          cp publication-inputs/macos-x86_64/* managed-assets/

          python3 scripts/verify_release_assets.py managed-assets \
            --tag "${{ github.ref_name }}" \
            --write-manifest \
            --verify-package-metadata
          python3 scripts/verify_release_assets.py managed-assets \
            --tag "${{ github.ref_name }}" \
            --verify-manifest \
            --verify-package-metadata

          version="${GITHUB_REF_NAME#v}"
          expected_repository_paths=(
            "csv-align-archive-keyring.pgp"
            "dists/stable/InRelease"
            "dists/stable/Release"
            "dists/stable/Release.gpg"
            "dists/stable/main/binary-amd64/Packages"
            "dists/stable/main/binary-amd64/Packages.gz"
            "dists/stable/main/dep11/Components-amd64.yml"
            "dists/stable/main/dep11/Components-amd64.yml.gz"
            "pool/main/c/csv-align/csv-align_${version}_amd64.deb"
          )
          printf '%s\n' "${expected_repository_paths[@]}" | sort > expected-repository-paths.txt
          find staged-pages/apt -type f -print \
            | sed 's#^staged-pages/apt/##' \
            | sort > actual-repository-paths.txt
          diff -u expected-repository-paths.txt actual-repository-paths.txt
          while IFS= read -r relative_path; do
            test -s "staged-pages/apt/${relative_path}"
          done < expected-repository-paths.txt

          cmp \
            "managed-assets/CSV.Align_${version}_amd64.deb" \
            "staged-pages/apt/pool/main/c/csv-align/csv-align_${version}_amd64.deb"
          gzip --decompress --stdout \
            staged-pages/apt/dists/stable/main/binary-amd64/Packages.gz \
            | cmp - staged-pages/apt/dists/stable/main/binary-amd64/Packages
          gzip --decompress --stdout \
            staged-pages/apt/dists/stable/main/dep11/Components-amd64.yml.gz \
            | cmp - staged-pages/apt/dists/stable/main/dep11/Components-amd64.yml
          grep -Fx "Package: csv-align" staged-pages/apt/dists/stable/main/binary-amd64/Packages
          grep -Fx "Version: ${version}" staged-pages/apt/dists/stable/main/binary-amd64/Packages
          grep -Fx "Filename: pool/main/c/csv-align/csv-align_${version}_amd64.deb" \
            staged-pages/apt/dists/stable/main/binary-amd64/Packages

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(r"^## (?P<tag>v[^\s]+) - \d{4}-\d{2}-\d{2}$")
          notes = []
          collecting = False
          for line in lines:
              match = heading.match(line)
              if match:
                  if collecting:
                      break
                  collecting = match.group("tag") == tag
                  continue
              if collecting:
                  notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              raise SystemExit(f"missing or empty changelog notes for {tag}")
          pathlib.Path("release-notes.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Classify existing release
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>release-error.txt)"; then
            printf '%s' "${release_json}" > release-response.json
            if ! jq --exit-status --arg tag "${RELEASE_TAG}" \
              '.tag_name == $tag and (.id | type == "number") and (.draft | type == "boolean") and (.prerelease | type == "boolean")' \
              release-response.json >/dev/null; then
              echo "Release API response is missing required typed fields or does not match ${RELEASE_TAG}." >&2
              exit 1
            fi
            release_id="$(jq -r '.id' release-response.json)"
            is_draft="$(jq -r '.draft' release-response.json)"
            if [ "${is_draft}" = "true" ]; then
              state="draft"
            else
              state="published"
            fi
          elif grep -q "HTTP 404" release-error.txt; then
            state="absent"
            release_id=""
          else
            cat release-error.txt >&2
            echo "Unable to classify existing release; refusing to treat an API failure as absence." >&2
            exit 1
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Release state: ${state}"

      - name: Reject release and APT version rollback
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          candidate_version="${GITHUB_REF_NAME#v}"
          published_tags_file="$(mktemp)"
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "${published_tags_file}"

          version_check_args=(
            --candidate "${candidate_version}"
            --published-tags-file "${published_tags_file}"
          )
          pages_error="$(mktemp)"
          if pages_json="$(gh api "repos/${REPOSITORY}/pages" 2>"${pages_error}")"; then
            pages_url="$(printf '%s' "${pages_json}" | jq -r '.html_url // empty')"
            if [ -z "${pages_url}" ]; then
              echo "GitHub Pages API response did not include html_url; refusing publication." >&2
              exit 1
            fi

            hosted_packages_file="$(mktemp)"
            hosted_packages_url="${pages_url%/}/apt/dists/stable/main/binary-amd64/Packages"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${hosted_packages_url}?release-order-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output "${hosted_packages_file}"; then
              version_check_args+=(--hosted-packages-file "${hosted_packages_file}")
            elif [ -s "${published_tags_file}" ]; then
              echo "Published releases exist but the hosted APT version could not be read; refusing publication." >&2
              exit 1
            else
              echo "No hosted APT package exists yet; treating this as the first publication."
            fi
          elif grep -q "HTTP 404" "${pages_error}"; then
            echo "GitHub Pages is not enabled. Configure Pages to use GitHub Actions before the first release." >&2
            exit 1
          else
            cat "${pages_error}" >&2
            echo "Unable to inspect the current GitHub Pages repository; refusing publication." >&2
            exit 1
          fi

          python3 scripts/check_release_version_order.py "${version_check_args[@]}"

      - name: Verify immutable published release and no-op
        if: steps.release_state.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path("release-response.json").read_text(encoding="utf-8"))
          tag = os.environ["GITHUB_REF_NAME"]
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          normalize = lambda value: value.replace("\r\n", "\n").strip()
          expected = {
              "tag_name": tag,
              "name": f"CSV Align {tag}",
              "draft": False,
              "prerelease": False,
          }
          for field, value in expected.items():
              if release.get(field) != value:
                  raise SystemExit(
                      f"immutable release metadata mismatch for {field}: "
                      f"expected {value!r}, found {release.get(field)!r}"
                  )
          if normalize(release.get("body") or "") != normalize(notes):
              raise SystemExit("immutable release notes do not match the tagged changelog section")
          PY

          mkdir published-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir published-assets

          if ! python3 scripts/verify_release_assets.py published-assets \
            --tag "${{ github.ref_name }}" \
            --verify-manifest \
            --verify-package-metadata; then
            echo "::error title=Immutable release mismatch::Published release ${{ github.ref_name }} is immutable and does not match the exact managed asset contract. No release or Pages content was changed." >&2
            exit 1
          fi
          echo "Published release ${{ github.ref_name }} is consistent and immutable; no publication mutation is required."

      - name: Create or refresh draft release
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release_state.outputs.state }}" = "absent" ]; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "CSV Align ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --draft \
              --verify-tag
          else
            gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "CSV Align ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --draft=true \
              --prerelease=false
          fi

      - name: Replace complete draft asset set
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          asset_ids="$(gh api --paginate "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].id')"
          while IFS= read -r asset_id; do
            [ -z "${asset_id}" ] || gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${asset_id}"
          done <<< "${asset_ids}"

          remaining_assets="$(gh api --paginate "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].id')"
          if [ -n "${remaining_assets}" ]; then
            echo "Draft release assets were not completely removed; refusing partial replacement." >&2
            exit 1
          fi

          assets=(managed-assets/*)
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${REPOSITORY}"

      - name: Redownload and verify exact draft assets
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir verified-draft-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir verified-draft-assets
          python3 scripts/verify_release_assets.py verified-draft-assets \
            --tag "${{ github.ref_name }}" \
            --verify-manifest \
            --verify-package-metadata

      - name: Configure GitHub Pages
        if: steps.release_state.outputs.state != 'published'
        uses: actions/configure-pages@v5

      - name: Upload verified staged APT Pages artifact
        if: steps.release_state.outputs.state != 'published'
        uses: actions/upload-pages-artifact@v4
        with:
          path: staged-pages

      - name: Deploy verified APT repository to GitHub Pages
        if: steps.release_state.outputs.state != 'published'
        id: deploy_apt_pages
        uses: actions/deploy-pages@v4

      - name: Verify public APT repository matches the staged site
        if: steps.release_state.outputs.state != 'published'
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deploy_apt_pages.outputs.page_url }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pages_base_url="${PAGES_DEPLOYMENT_URL%/}/apt"
          paths=(
            csv-align-archive-keyring.pgp
            dists/stable/InRelease
            dists/stable/Release
            dists/stable/Release.gpg
            dists/stable/main/binary-amd64/Packages
            dists/stable/main/binary-amd64/Packages.gz
            dists/stable/main/dep11/Components-amd64.yml
            dists/stable/main/dep11/Components-amd64.yml.gz
            "pool/main/c/csv-align/csv-align_${version}_amd64.deb"
          )
          verified=false
          remote_dir="$(mktemp -d)"
          trap 'rm -rf "${remote_dir}"' EXIT

          for attempt in $(seq 1 30); do
            rm -rf "${remote_dir}"
            mkdir -p "${remote_dir}"
            matched=true
            for relative_path in "${paths[@]}"; do
              mkdir -p "${remote_dir}/$(dirname "${relative_path}")"
              if ! curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${pages_base_url}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                --output "${remote_dir}/${relative_path}"; then
                matched=false
                break
              fi
              if ! cmp "staged-pages/apt/${relative_path}" "${remote_dir}/${relative_path}"; then
                matched=false
                break
              fi
            done
            if [ "${matched}" = "true" ]; then
              verified=true
              break
            fi
            echo "Hosted APT repository has not converged yet (attempt ${attempt}/30)."
            sleep 20
          done

          if [ "${verified}" != "true" ]; then
            echo "Hosted APT repository did not match the staged repository within 10 minutes." >&2
            exit 1
          fi

          verification_home="$(mktemp -d)"
          chmod 700 "${verification_home}"
          GNUPGHOME="${verification_home}" gpg --batch --import "${remote_dir}/csv-align-archive-keyring.pgp"
          GNUPGHOME="${verification_home}" gpg --batch --verify "${remote_dir}/dists/stable/InRelease"
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            "${remote_dir}/dists/stable/Release.gpg" \
            "${remote_dir}/dists/stable/Release"
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            verified-draft-assets/csv-align-repository-setup_1.0_all.deb.sha256.asc \
            verified-draft-assets/csv-align-repository-setup_1.0_all.deb.sha256
          rm -rf "${verification_home}"

      - name: Publish GitHub Release after Pages verification
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease=false
